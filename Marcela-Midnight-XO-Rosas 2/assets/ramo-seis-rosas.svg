<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 390" role="img" aria-labelledby="title desc">
  <title id="title">Ramo de seis rosas</title>
  <desc id="desc">Un ramo ilustrado con tres rosas rojas y tres rosas blancas, hojas verdes oscuras y un lazo color vino.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#9b214b" stop-opacity=".27"/>
      <stop offset="1" stop-color="#9b214b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#243b30"/><stop offset=".52" stop-color="#648367"/><stop offset="1" stop-color="#182b24"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#56735b"/><stop offset=".5" stop-color="#233d31"/><stop offset="1" stop-color="#101c19"/>
    </linearGradient>
    <linearGradient id="redPetal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff7995"/><stop offset=".38" stop-color="#c92c53"/><stop offset="1" stop-color="#5b0d2b"/>
    </linearGradient>
    <linearGradient id="redInner" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff9aab"/><stop offset=".48" stop-color="#ed4168"/><stop offset="1" stop-color="#821333"/>
    </linearGradient>
    <linearGradient id="whitePetal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffaf0"/><stop offset=".54" stop-color="#e9dce3"/><stop offset="1" stop-color="#a98b9c"/>
    </linearGradient>
    <linearGradient id="wrap" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4d1832"/><stop offset=".48" stop-color="#220e21"/><stop offset="1" stop-color="#63172e"/>
    </linearGradient>
    <g id="roseRed">
      <path d="M-31 1 C-37-15-22-34-5-32 C9-43 28-29 29-13 C43 0 28 23 12 28 C-5 40-29 25-31 1Z" fill="url(#redPetal)" stroke="#ef6482" stroke-width="1.1"/>
      <path d="M-24-8 C-22-22-7-28 2-19 C14-26 26-14 21-3 C30 8 17 22 6 19 C-5 29-20 16-17 7 C-28 4-31-2-24-8Z" fill="#a71942" stroke="#f45b7c" stroke-width="1"/>
      <path d="M-15-8 C-17-19-2-22 5-14 C16-18 20-7 13-1 C21 9 7 17 0 10 C-10 17-18 5-10 0 C-18-1-19-5-15-8Z" fill="url(#redInner)" stroke="#ff97a9" stroke-width="1.1"/>
      <path d="M-7-5 C-3-13 10-10 9-2 C16 4 6 13 0 6 C-7 12-13 3-7-1 C-10-2-10-4-7-5Z" fill="#62102d" stroke="#ff8ea6" stroke-width="1.1"/>
      <path d="M-19-23 Q-8-29-2-19 M9-27 Q21-21 19-12 M22 8 Q18 20 7 22" fill="none" stroke="#ffb1c0" stroke-opacity=".72" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <g id="roseWhite">
      <path d="M-31 1 C-37-15-22-34-5-32 C9-43 28-29 29-13 C43 0 28 23 12 28 C-5 40-29 25-31 1Z" fill="url(#whitePetal)" stroke="#fff6f6" stroke-width="1.1"/>
      <path d="M-24-8 C-22-22-7-28 2-19 C14-26 26-14 21-3 C30 8 17 22 6 19 C-5 29-20 16-17 7 C-28 4-31-2-24-8Z" fill="#e8d2dd" stroke="#c9a9bc" stroke-width="1"/>
      <path d="M-15-8 C-17-19-2-22 5-14 C16-18 20-7 13-1 C21 9 7 17 0 10 C-10 17-18 5-10 0 C-18-1-19-5-15-8Z" fill="#fff4f2" stroke="#d9b6c9" stroke-width="1.1"/>
      <path d="M-7-5 C-3-13 10-10 9-2 C16 4 6 13 0 6 C-7 12-13 3-7-1 C-10-2-10-4-7-5Z" fill="#bc92a9" stroke="#f8e4ec" stroke-width="1.1"/>
      <path d="M-19-23 Q-8-29-2-19 M9-27 Q21-21 19-12 M22 8 Q18 20 7 22" fill="none" stroke="#fff" stroke-opacity=".86" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <g id="leafShape">
      <path d="M0 0 C-7-23 8-42 35-44 C34-20 19-4 0 0Z" fill="url(#leaf)" stroke="#729178" stroke-width="1"/>
      <path d="M1-2 Q16-20 31-39" fill="none" stroke="#96b09a" stroke-opacity=".75" stroke-width="1.2"/>
    </g>
  </defs>
  <ellipse cx="210" cy="175" rx="190" ry="177" fill="url(#halo)"/>
  <!-- Six stems, behind the flower heads -->
  <g fill="none" stroke="url(#stem)" stroke-width="5" stroke-linecap="round">
    <path d="M150 93 Q147 190 202 326"/>
    <path d="M210 63 Q211 194 210 329"/>
    <path d="M270 95 Q274 192 217 329"/>
    <path d="M108 160 Q136 234 198 330"/>
    <path d="M207 143 Q204 238 211 330"/>
    <path d="M312 160 Q282 236 219 330"/>
  </g>
  <!-- Leaves -->
  <g>
    <use href="#leafShape" transform="translate(150 204) rotate(-50) scale(.82)"/>
    <use href="#leafShape" transform="translate(176 250) rotate(18) scale(.77)"/>
    <use href="#leafShape" transform="translate(237 224) rotate(-12) scale(.82)"/>
    <use href="#leafShape" transform="translate(262 187) rotate(38) scale(.8)"/>
    <use href="#leafShape" transform="translate(137 241) rotate(-76) scale(.62)"/>
    <use href="#leafShape" transform="translate(248 267) rotate(29) scale(.66)"/>
    <use href="#leafShape" transform="translate(193 207) rotate(-120) scale(.68)"/>
    <use href="#leafShape" transform="translate(225 188) rotate(48) scale(.68)"/>
  </g>
  <!-- Elegant dark wrap -->
  <path d="M120 216 Q210 255 300 216 L268 337 Q210 370 152 337Z" fill="url(#wrap)" stroke="#a94b70" stroke-opacity=".7" stroke-width="1.5"/>
  <path d="M136 225 Q208 266 284 225 L257 334 Q211 352 164 334Z" fill="none" stroke="#e2a0ba" stroke-opacity=".36" stroke-width="1"/>
  <path d="M155 232 L182 350 M265 232 L237 350" stroke="#d77b9b" stroke-opacity=".23" stroke-width="1.5"/>
  <!-- Bow -->
  <path d="M206 299 C184 279 159 287 171 309 C181 322 199 313 210 305 C225 321 246 318 250 302 C253 282 225 284 210 299Z" fill="#791a3b" stroke="#d9678b" stroke-width="1.6"/>
  <path d="M209 304 C194 323 191 341 184 354 L207 348 L216 310Z" fill="#54102c" stroke="#b94b70" stroke-width="1.2"/>
  <path d="M213 305 C232 325 236 340 244 351 L219 346 L208 310Z" fill="#8e2146" stroke="#d9678b" stroke-width="1.2"/>
  <ellipse cx="210" cy="304" rx="8" ry="7" fill="#e77d9e" stroke="#ffc0d0" stroke-width="1"/>
  <!-- Exactly three red roses and three white roses -->
  <use href="#roseRed" transform="translate(150 93) rotate(-12)"/>
  <use href="#roseWhite" transform="translate(210 63) rotate(7)"/>
  <use href="#roseRed" transform="translate(270 95) rotate(13)"/>
  <use href="#roseWhite" transform="translate(108 160) rotate(-9) scale(.98)"/>
  <use href="#roseRed" transform="translate(207 143) rotate(4) scale(1.04)"/>
  <use href="#roseWhite" transform="translate(312 160) rotate(8) scale(.98)"/>
</svg>
